name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions: {}

concurrency:
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fleet-security:
    name: Fleet security
    uses: agentic-machinery/machinery/.github/workflows/fleet-security.yml@12f0ce5664024b1680ec9ffbfa1a2c6a4b078705 # machinery#1110, #1114
    permissions:
      contents: read
    with:
      run-actionlint: true
      run-shellcheck: true
      shellcheck-paths: |
        hramatka/api/deploy|style
        hramatka|error
      shellcheck-severity: style
      run-zizmor: true
      run-secret-scan: true
      secret-scan-required-extensions: .py,.ts,.tsx,.sh
      run-trivy-fs: true
      trivy-fs-targets: |
        hramatka/app/package-lock.json
      trivy-scanners: vuln,license
      trivy-severity: HIGH,CRITICAL
      trivy-include-dev-deps: true

  # Trivy 0.76.2's uv.lock parser inventories Python packages for CVEs without
  # emitting SPDX licence metadata, so run uv.lock with vuln-only scanning and
  # never emit a misleading zero-finding licence receipt for Python.
  python-dependencies:
    name: Python dependencies
    uses: agentic-machinery/machinery/.github/workflows/fleet-security.yml@12f0ce5664024b1680ec9ffbfa1a2c6a4b078705 # machinery#1110, #1114
    permissions:
      contents: read
    with:
      run-trivy-fs: true
      trivy-fs-targets: |
        uv.lock
      trivy-scanners: vuln
      trivy-severity: HIGH,CRITICAL
