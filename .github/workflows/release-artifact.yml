name: Release artifact

# Builds an immutable product artifact for an exact git SHA.
# Host deploy / secrets stay in learn-ukrainian-infra-private (Hramatka CD).

on:
  workflow_dispatch:
  # Preserve existing push-to-main release packing trigger. Safe because this
  # job holds read-only contents permission, restricts workflow_run to
  # same-repository successful push runs on main, checks out refs/heads/main,
  # and verifies RELEASE_SHA is a 40-hex ancestor of main before detaching.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: release-artifact-${{ github.repository }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  pack:
    name: Pack release artifact
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and select release commit
        id: rev
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! git merge-base --is-ancestor "$RELEASE_SHA" HEAD; then
            echo "Release SHA is not a commit on main" >&2
            exit 1
          fi
          # Delayed CI runs can select a checkout with an older packer CLI.
          git show "$GITHUB_WORKFLOW_SHA:hramatka/ci/release_artifact.py" \
            > "$RUNNER_TEMP/hramatka-release-artifact.py"
          runtime_root=.
          pin_history="$(git rev-list -1 "$RELEASE_SHA" -- .python-version)"
          if [[ -z "$pin_history" ]]; then
            # Delayed or replayed CI runs can select a commit from before the pin.
            runtime_root="$(mktemp -d "$RUNNER_TEMP/hramatka-runtime.XXXXXX")"
            cp --parents .python-version hramatka/app/package.json "$runtime_root"
          fi
          git checkout --detach "$RELEASE_SHA"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "runtime_root=$runtime_root" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ steps.rev.outputs.runtime_root }}/hramatka/app/package.json

      - name: Build teacher app
        working-directory: hramatka/app
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci
          npm run build
          node scripts/csp-guard.mjs

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ${{ steps.rev.outputs.runtime_root }}/.python-version

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          checksum: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
          download-from-astral-mirror: 'false'
          enable-cache: 'false'

      - name: Pack + verify artifact
        env:
          RELEASE_SHA: ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          python --version
          packer="$RUNNER_TEMP/hramatka-release-artifact.py"
          uv build --wheel --no-python-downloads --python "$(command -v python)" \
            --out-dir "$RUNNER_TEMP/hramatka-wheel"
          python "$packer" pack --repo . \
            --wheel "$RUNNER_TEMP/hramatka-wheel/"*.whl --out-dir "$RUNNER_TEMP/hramatka-release"
          python "$packer" verify \
            "$RUNNER_TEMP/hramatka-release/hramatka-release-${RELEASE_SHA}.tar.gz" \
            --expect-sha "$RELEASE_SHA"
          cat "$RUNNER_TEMP/hramatka-release/manifest.json"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hramatka-release-${{ steps.rev.outputs.sha }}
          path: |
            ${{ runner.temp }}/hramatka-release/hramatka-release-${{ steps.rev.outputs.sha }}.tar.gz
            ${{ runner.temp }}/hramatka-release/manifest.json
          if-no-files-found: error
          retention-days: 30
