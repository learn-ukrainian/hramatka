name: Release artifact

# Builds an immutable product artifact for an exact git SHA.
# Host deploy / secrets stay in learn-ukrainian-infra-private (Hramatka CD).

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: release-artifact-${{ github.repository }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pack:
    name: Pack release artifact
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and select release commit
        id: rev
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! git merge-base --is-ancestor "$RELEASE_SHA" HEAD; then
            echo "Release SHA is not a commit on main" >&2
            exit 1
          fi
          git checkout --detach "$RELEASE_SHA"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build teacher app
        working-directory: hramatka/app
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npm ci && break
            sleep $((attempt * 10))
            if [[ $attempt -eq 3 ]]; then exit 1; fi
          done
          npm run build
          node scripts/csp-guard.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pack + verify artifact
        run: |
          set -euo pipefail
          python hramatka/ci/release_artifact.py pack --repo . --out-dir "$RUNNER_TEMP/hramatka-release"
          python hramatka/ci/release_artifact.py verify \
            "$RUNNER_TEMP/hramatka-release/hramatka-release-${{ steps.rev.outputs.sha }}.tar.gz" \
            --expect-sha "${{ steps.rev.outputs.sha }}"
          cat "$RUNNER_TEMP/hramatka-release/manifest.json"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hramatka-release-${{ steps.rev.outputs.sha }}
          path: |
            ${{ runner.temp }}/hramatka-release/hramatka-release-${{ steps.rev.outputs.sha }}.tar.gz
            ${{ runner.temp }}/hramatka-release/manifest.json
          if-no-files-found: error
          retention-days: 30
