name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  frontend:
    name: Frontend (lint + typecheck + unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: hramatka/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: hramatka/app/package.json
          cache: npm
          cache-dependency-path: hramatka/app/package-lock.json
      - name: Verify npm install-script policy
        run: |
          set -euo pipefail
          node --version
          npm --version
          # Use the app policy with one local tarball so the probe needs no registry packages.
          probe="$(mktemp -d "$RUNNER_TEMP/npm-script-policy.XXXXXX")"
          cp .npmrc "$probe/"
          cd "$probe"
          mkdir dependency
          printf '%s\n' '{"name":"hramatka-npm-policy-probe","version":"1.0.0","scripts":{"postinstall":"touch unexpected-install-script"}}' > dependency/package.json
          npm pack ./dependency --ignore-scripts --offline --quiet
          printf '%s\n' '{"private":true,"dependencies":{"hramatka-npm-policy-probe":"file:hramatka-npm-policy-probe-1.0.0.tgz"}}' > package.json
          npm install --package-lock-only --ignore-scripts --offline --no-audit
          if npm ci --offline --no-audit --color=false > probe.log 2>&1; then
            cat probe.log
            echo "::error::npm ci accepted an unapproved install script"
            exit 1
          fi
          cat probe.log
          grep -Fxq 'npm error code ESTRICTALLOWSCRIPTS' probe.log
          grep -Fq 'hramatka-npm-policy-probe@1.0.0' probe.log
          test ! -e node_modules/hramatka-npm-policy-probe/unexpected-install-script
          echo "npm ci refused the unapproved probe postinstall script."
      - name: npm ci
        run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: unit + build guard
        run: npm test
        env:
          CI: true

  python:
    name: Python (guards + ruff + DB-free unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          checksum: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
          download-from-astral-mirror: 'false'
          enable-cache: 'false'
      - name: Install tooling (uv.lock)
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/hramatka-venv"
          rm -rf "$venv"
          UV_PROJECT_ENVIRONMENT="$venv" uv sync --locked --no-install-project --no-build --extra dev
          printf '%s\n' "$venv/bin" >> "$GITHUB_PATH"
      - name: Boundary + vendor guards
        run: |
          python --version
          python hramatka/engine/tools/check_boundary.py
          python hramatka/engine/tools/check_vendor_guard.py
      - name: Ruff (CI surface only)
        run: |
          ruff check \
            hramatka/engine/tools \
            hramatka/engine/tests/test_boundary.py \
            hramatka/engine/tests/test_schema.py \
            hramatka/engine/tests/test_json_tolerance.py \
            hramatka/engine/tests/test_pinning.py \
            hramatka/engine/tests/test_schema_tokens.py \
            hramatka/engine/tests/test_vesum_gate.py \
            hramatka/engine/tests/test_vesum_tags.py
      - name: DB-free engine unit tests
        run: |
          pytest -q \
            hramatka/engine/tests/test_boundary.py \
            hramatka/engine/tests/test_schema.py \
            hramatka/engine/tests/test_json_tolerance.py \
            hramatka/engine/tests/test_pinning.py \
            hramatka/engine/tests/test_schema_tokens.py
        env:
          CI: true
      - name: Release artifact packer unit tests
        run: |
          PYTHONPATH=hramatka/ci pytest -q hramatka/ci/tests/test_release_artifact.py
        env:
          CI: true

      - name: VESUM / Atlas fixture engine suite (P2.3b)
        run: |
          pytest -q \
            hramatka/engine/tests/test_vesum_gate.py \
            hramatka/engine/tests/test_vesum_tags.py \
            hramatka/engine/tests/test_russianism_e2e.py
        env:
          CI: true
      - name: DB-free API unit tests
        run: |
          pytest -q \
            tests/test_google_teacher_auth.py \
            tests/test_local_static_teacher.py \
            tests/test_pilot_backend_contract.py \
            tests/test_teacher_api_surface.py \
            tests/test_teacher_passkeys.py \
            tests/test_teacher_sample_semantic_review.py
        env:
          CI: true

  e2e:
    name: Frontend Playwright (packaged e2e)
    runs-on: ubuntu-24.04
    container:
      # Match the Playwright version in hramatka/app/package-lock.json.
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: hramatka/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: hramatka/app/package.json
          cache: npm
          cache-dependency-path: hramatka/app/package-lock.json
      - name: npm ci
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci
      - name: Playwright e2e (default config; no live teacher stack)
        run: npm run test:e2e -- --project=chromium
        env:
          CI: true

  ci-gate:
    name: CI Gate
    if: always()
    needs: [frontend, python, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify every required CI job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if ! actual="$(jq -r 'if type == "object" then keys[] else error("not an object") end' \
                <<< "$NEEDS_JSON" 2> /dev/null)"; then
            echo "::error::Job results are not a JSON object; failing closed"
            exit 1
          fi
          expected=(frontend python e2e)
          failed=0
          for job in "${expected[@]}"; do
            result="$(jq -r --arg job "$job" \
              '.[$job].result // "missing" | if type == "string" then . else "invalid" end' \
              <<< "$NEEDS_JSON")"
            echo "${job}: ${result} (required success)"
            if [ "$result" != "success" ]; then
              echo "::error::Required job ${job} finished with result ${result}"
              failed=1
            fi
          done
          while IFS= read -r job; do
            [ -n "$job" ] || continue
            if ! printf '%s\n' "${expected[@]}" | grep -qxF -- "$job"; then
              echo "::error::Unexpected job ${job} in CI Gate needs"
              failed=1
            fi
          done <<< "$actual"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "CI Gate green: ${#expected[@]} required job(s) succeeded."
