openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Hramatka teacher pilot API
  version: 1.0.0-pilot-frozen
  license:
    name: Proprietary private pilot contract
    url: https://github.com/learn-ukrainian/learn-ukrainian-infra-private
  description: |
    Frozen same-origin browser contract for the pasted-text-only Hramatka pilot.
    Teacher API authorization uses the HttpOnly pilot-session cookie. Invite,
    passkey, and recovery-code entry doors all mint that same cookie; the legacy
    shared bearer credential is deliberately absent from this contract.
servers:
  - url: /
    description: Same origin as the static teacher application
tags:
  - name: Session
    description: Invite exchange and current-session lifecycle.
  - name: Lessons
    description: Owner-scoped bake, review, acceptance, and catalog lifecycle.
  - name: Teacher
    description: Per-teacher preferences (owner-scoped; display_name remains identity-owned).
  - name: Probes
    description: Unauthenticated process-health and deployment-readiness probes.
paths:
  /api/passkeys/enrollment/options:
    post:
      tags: [Session]
      operationId: beginPasskeyEnrollment
      summary: Issue a session-bound, single-use WebAuthn registration ceremony
      security: [{PilotSession: []}]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200': {description: WebAuthn publicKey options and opaque challenge ID}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CsrfRejected'}
  /api/passkeys/authentication/options:
    post:
      tags: [Session]
      operationId: beginPasskeyAuthentication
      summary: Issue a single-use WebAuthn assertion ceremony
      security: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200': {description: WebAuthn publicKey options and opaque challenge ID}
        '403': {$ref: '#/components/responses/CsrfRejected'}
  /api/passkeys/enrollment/{challenge_id}:
    post:
      tags: [Session]
      operationId: completePasskeyEnrollment
      summary: Verify registration and return one-time recovery codes
      security: [{PilotSession: []}]
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200': {description: Credential committed; recovery codes are shown once}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '410': {description: Challenge expired, replayed, or belongs to another session}
  /api/passkeys/authentication:
    post:
      tags: [Session]
      operationId: completePasskeyAuthentication
      summary: Verify an assertion and mint the ordinary pilot session
      security: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Ordinary session established
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/recovery-codes/redeem:
    post:
      tags: [Session]
      operationId: redeemRecoveryCode
      summary: Consume one recovery-code digest and mint the ordinary session
      security: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Ordinary session established
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/recovery-codes/regenerate:
    post:
      tags: [Session]
      operationId: regenerateRecoveryCodes
      summary: Supersede unused recovery codes and show a new set once
      security: [{PilotSession: []}]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200': {description: New recovery codes, never persisted as plaintext}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CsrfRejected'}
  /api/session/redeem:
    post:
      tags: [Session]
      operationId: redeemPilotInvite
      summary: Exchange one invite token for a pilot session
      security: []
      description: |
        The teacher bundle reads the token from `#invite=<token>`, binds a
        tab-local `sessionStorage` entry nonce, and posts both once,
        and immediately replaces the URL with `/teacher/`. Missing, unknown,
        used, expired, and revoked invites all return the same `410` response.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRedeemRequest'
      responses:
        '200':
          description: Invite consumed and session committed
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '410':
          $ref: '#/components/responses/InviteUnavailable'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/auth/google/options:
    post:
      tags: [Session]
      operationId: issueGoogleTeacherSignInNonce
      summary: Issue a short-lived one-use nonce for Google Identity Services
      description: |
        This same-origin request is the only browser-started state change. An
        anonymous request issues a sign-in nonce; a valid current session plus
        CSRF proof issues a nonce bound to that existing teacher for first-time
        Google linking. It never creates a teacher account or returns a bearer
        credential. The endpoint is absent until the public OAuth client id is
        configured.
      security: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: GIS public client id, exact callback URI, and one-use nonce
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          description: Google sign-in is not configured
        '409':
          description: The current teacher already has a Google sign-in linked
  /api/auth/google/complete:
    post:
      tags: [Session]
      operationId: completeGoogleTeacherSignIn
      summary: Verify a Google redirect credential and establish the ordinary cookie session
      description: |
        Google Identity Services posts form fields `credential` and
        `g_csrf_token` to this exact same-origin callback. The server compares
        Google's double-submit CSRF cookie, verifies Google signature/JWKS,
        issuer, configured audience, expiry, issued-at, verified email, and
        one-use nonce. Only a pre-existing teacher link may sign in; no public
        registration or credential persistence occurs. Success redirects to the
        teacher SPA after setting the ordinary HttpOnly session cookie.
      security: []
      responses:
        '303':
          description: Redirect to the teacher SPA; failure is deliberately generic
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
  /api/session:
    get:
      tags: [Session]
      operationId: getPilotSession
      summary: Resolve the current teacher session and its current CSRF token
      security:
        - PilotSession: []
      responses:
        '200':
          description: Current non-expired, non-revoked session
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
    delete:
      tags: [Session]
      operationId: revokeCurrentPilotSession
      summary: Revoke the current session and expire its cookie
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session revocation committed; no response body
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/teacher/preferences:
    get:
      tags: [Teacher]
      operationId: getTeacherPreferences
      summary: Return the authenticated teacher's persisted defaults (e.g. default lesson duration)
      security:
        - PilotSession: []
      responses:
        '200':
          description: Current qualified new-lesson default (45 minutes; legacy preference rows are normalized to 45)
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherPreferences'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
    put:
      tags: [Teacher]
      operationId: putTeacherPreferences
      summary: Persist updated teacher defaults (owner-scoped, CSRF protected)
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherPreferences'
      responses:
        '200':
          description: Updated defaults committed
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherPreferences'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lesson-models:
    get:
      tags: [Lessons]
      operationId: listQualifiedLessonModels
      summary: List logical models qualified for the current lesson contract
      description: |
        Returns only teacher-visible logical identities with complete current
        production-path receipts. Provider routes, wire model IDs, credentials,
        and fallback order are deliberately absent. When `models` is empty,
        `unavailable_code` provides a safe recovery state; it never exposes a
        provider response, quota value, credential, or routing detail.
      security:
        - PilotSession: []
      responses:
        '200':
          description: Current fail-closed qualified choice set
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualifiedModelList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons:
    post:
      tags: [Lessons]
      operationId: createLesson
      summary: Create or recover an idempotent anchor bake
      description: |
        The browser creates a UUID and reuses it for network retries. The
        request hash covers the pasted-text `anchor`,
        `level`, `duration`, `methodology`, normalized `focus` and
        `grammar_focus` (`null` when omitted), and `logical_model_id`. Same UUID and same request returns the existing
        aggregate with `reused: true`; different input or a model that is not
        currently qualified/configured returns `409` with its distinct code.
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonCreateRequest'
      responses:
        '202':
          description: New bake durably queued or identical existing aggregate returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonCreateAccepted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '409':
          $ref: '#/components/responses/CreateLessonConflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
    get:
      tags: [Lessons]
      operationId: listLessons
      summary: List every lesson owned by the current teacher
      description: |
        Returns metadata only, newest first by `created_at DESC, id DESC`.
        `anchor_snippet` is capped to a short preview; the full anchor remains
        available only from the owner-scoped lesson resource.
        No row owned by another teacher may participate in this query.
      security:
        - PilotSession: []
      responses:
        '200':
          description: Owner-scoped lesson catalog, including an empty catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonCatalog'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons/{lesson_id}/status:
    get:
      tags: [Lessons]
      operationId: getLessonStatus
      summary: Poll one owner-scoped bake status
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Durable aggregate status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/LessonNotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons/{lesson_id}:
    get:
      tags: [Lessons]
      operationId: getLesson
      summary: Get one ready owner-scoped lesson resource
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Validated lesson plus concurrency and acceptance metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/LessonNotFound'
        '409':
          $ref: '#/components/responses/LessonNotReady'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
    delete:
      tags: [Lessons]
      operationId: deleteLesson
      summary: Delete one inactive owner-scoped lesson job
      description: Active `draft` and `baking` jobs must first use `cancelLesson`; a cancelled claimed bake remains temporarily undeletable until its worker acknowledges quiescence. Deletion never detaches in-flight provider work.
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Lesson job deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/LessonNotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons/{lesson_id}/cancel:
    post:
      tags: [Lessons]
      operationId: cancelLesson
      summary: Terminally cancel the exact active lesson revision
      description: |
        Cancels only `draft` or `baking` work. A provider call already in flight
        may finish remotely, but its result cannot publish after cancellation.
        Repeating the returned cancelled revision is an idempotent no-op.
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/RevisionMutation'
      responses:
        '200':
          description: Durable cancellation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/LessonNotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons/{lesson_id}/retry:
    post:
      tags: [Lessons]
      operationId: retryLesson
      summary: Queue one new attempt for a failed or cancelled lesson
      description: |
        Retry preserves the job ID and records the terminal prior attempt. A
        replay with the same source revision is idempotent and cannot create a
        second attempt, even if the first retry has already been claimed. A
        cancelled or timed-out provider attempt must first acknowledge
        quiescence; until then retry returns `409 lesson_state_conflict` and
        cannot overlap hidden provider work with a new attempt.
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/RevisionMutation'
      responses:
        '202':
          description: Retry queued or same retry intent replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/LessonNotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons/{lesson_id}/recreate:
    post:
      tags: [Lessons]
      operationId: recreateLesson
      summary: Start a fresh bake from the stored request of an existing lesson
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202':
          description: A new lesson job was queued from the stored request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonCreateAccepted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/LessonNotFound'
        '409':
          $ref: '#/components/responses/ModelUnavailable'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons/{lesson_id}/blocks/{block_id}/accept:
    post:
      tags: [Lessons]
      operationId: acknowledgeWarningBlock
      summary: Acknowledge one visible block that needs review
      description: |
        A block needs review when its `mark` is `warn` **or**
        `provenance.external_options` is true (UI-aligned needs-review set).
        Warn never auto-accepts: acknowledgement is always explicit.

        `block_id` additionally accepts the reserved lesson-level id
        `focus-status`, which acknowledges an unsupported requested focus
        (`lesson.focus_status.supported: false`). It is only ackable while that
        caveat stands, and `acceptLesson` requires it exactly like a warn block.
        Generated block ids (`block-<n>`, `restored-<hex>`) never collide with
        it. Any id outside the current needs-review set is a 404.
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/BlockId'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/RevisionMutation'
      responses:
        '200':
          description: Acknowledgement committed and the materialized lesson returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/WarningBlockNotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons/{lesson_id}/blocks/{block_id}/move:
    post:
      tags: [Lessons]
      operationId: moveLessonBlock
      summary: Move one block up or down in the review assembly
      description: |
        Within a phase, the block swaps with its neighbor. Crossing a phase
        boundary moves it one phase while preserving the rest of the ordered
        lesson. Reserve is derived from this order and the selected duration.
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/BlockId'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/BlockMoveMutation'
      responses:
        '200':
          description: Move committed and the materialized lesson returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/LessonBlockNotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons/{lesson_id}/blocks/{block_id}/remove:
    post:
      tags: [Lessons]
      operationId: removeLessonBlock
      summary: Move one block to the rejected tray with a teacher-removal reason
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/BlockId'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/RevisionMutation'
      responses:
        '200':
          description: Removal committed and the materialized lesson returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/LessonBlockNotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons/{lesson_id}/blocks/{block_id}/include:
    post:
      tags: [Lessons]
      operationId: includeReserveBlock
      summary: Include one reserve block in its phase's planned prefix
      description: The selected block must currently be reserve for the selected duration.
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/BlockId'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/RevisionMutation'
      responses:
        '200':
          description: Reserve selection committed and the materialized lesson returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/LessonBlockNotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons/{lesson_id}/blocks/{block_id}/activity:
    put:
      tags: [Lessons]
      operationId: replaceLessonBlockActivity
      summary: Replace a block activity with a validated pilot activity document
      description: |
        A replacement is validated against the digest-pinned `lu.activity.v1`
        schema and the frozen pilot activity registry. Replacing a warning
        never acknowledges it: the warning remains visible and any prior
        acknowledgement is cleared.
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/BlockId'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/ActivityReplacementMutation'
      responses:
        '200':
          description: Replacement committed and the materialized lesson returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/LessonBlockNotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons/{lesson_id}/blocks/{block_id}/regenerations:
    post:
      tags: [Lessons]
      operationId: createActivityRegeneration
      summary: Queue a checked replacement for one unchanged generated block
      description: |
        The current block remains in the lesson while a separate durable job
        regenerates its original allocation slot with the lesson's stored
        logical model. At most one replacement job is queued or running per
        lesson. Success atomically replaces only this block, increments the
        lesson revision, clears acceptance and this block's acknowledgement,
        and retains prompt/model and old/new block hashes. Failure leaves the
        lesson document and revision unchanged. Optional teacher feedback is
        untrusted model input and is never allowed to change the certified
        slot/type/plan or bypass normal gates.
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/BlockId'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/ActivityRegenerationCreate'
      responses:
        '202':
          description: Replacement job queued or the identical idempotent job returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRegeneration'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/LessonBlockNotFound'}
        '409': {$ref: '#/components/responses/CreateRegenerationConflict'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /api/lessons/{lesson_id}/regenerations/{regeneration_id}:
    get:
      tags: [Lessons]
      operationId: getActivityRegeneration
      summary: Poll one owner-scoped block replacement job
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/RegenerationId'
      responses:
        '200':
          description: Current durable replacement status and content-free provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRegeneration'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/RegenerationNotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /api/lessons/{lesson_id}/regenerations/{regeneration_id}/retry:
    post:
      tags: [Lessons]
      operationId: retryActivityRegeneration
      summary: Requeue a failed replacement against the current unchanged target
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/RegenerationId'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/RevisionMutation'
      responses:
        '202':
          description: Failed replacement job requeued with an incremented attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRegeneration'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/RegenerationNotFound'}
        '409': {$ref: '#/components/responses/RetryRegenerationConflict'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/PersistenceUnavailable'}
  /api/lessons/{lesson_id}/blocks/{block_id}/feedback:
    put:
      tags: [Lessons]
      operationId: putActivityFeedback
      summary: Record the teacher's verdict on an engine-flagged block
      description: |
        Upsert keyed on `(lesson_id, block_id)`. The server compares the
        block's flag-time `flagged_content_hash` with the current feedback
        row: a same-hash PUT revises the verdict in place, a hash mismatch
        soft-closes the old row (`superseded_at`) and starts a fresh one, and
        a block that is not currently `engine_flagged` is refused with 409.
        No `expected_revision`: staleness is hash-gated server-side.
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/BlockId'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/ActivityFeedbackMutation'
      responses:
        '200':
          description: Feedback recorded and the materialized lesson returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/LessonBlockNotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons/{lesson_id}/rejected/{rejected_index}/restore:
    post:
      tags: [Lessons]
      operationId: restoreRejectedBlock
      summary: Restore one rejected entry as a warning block
      description: |
        The rejected-tray index is revision-guarded and follows the returned
        `lesson.rejected[]` order. The restored entry is placed at the start of
        the selected phase, marked `warn`, and needs explicit acknowledgement
        before it can support lesson acceptance.
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/RejectedIndex'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/RestoreRejectedMutation'
      responses:
        '200':
          description: Restoration committed and the materialized lesson returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/RejectedEntryNotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons/{lesson_id}/accept:
    post:
      tags: [Lessons]
      operationId: acceptLesson
      summary: Accept the exact current lesson revision
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/RevisionMutation'
      responses:
        '200':
          description: Acceptance committed at the returned revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/LessonNotFound'
        '409':
          $ref: '#/components/responses/AcceptanceConflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/lessons/{lesson_id}/draft:
    post:
      tags: [Lessons]
      operationId: returnLessonToDraft
      summary: Clear final acceptance at the exact current revision
      security:
        - PilotSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/RevisionMutation'
      responses:
        '200':
          description: Draft transition committed and revision incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/LessonNotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/PersistenceUnavailable'
  /api/healthz:
    get:
      tags: [Probes]
      operationId: healthz
      summary: Report that the API process can serve HTTP
      security: []
      responses:
        '200':
          description: Process is alive; this does not assert readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/readyz:
    get:
      tags: [Probes]
      operationId: readyz
      summary: Check SQLite/schema and real-baker production wiring
      security: []
      responses:
        '200':
          description: Database is writable, migrations are current, and mock mode is off
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          $ref: '#/components/responses/NotReady'
components:
  securitySchemes:
    PilotSession:
      type: apiKey
      in: cookie
      name: __Host-hramatka_session
      description: Opaque 256-bit session secret; only its digest is stored.
  parameters:
    LessonId:
      name: lesson_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Browser-generated UUID used as both lesson ID and idempotency key.
    BlockId:
      name: block_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
    RejectedIndex:
      name: rejected_index
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
      description: Zero-based index in the `lesson.rejected[]` array at expected_revision.
    RegenerationId:
      name: regeneration_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Browser-generated idempotency key for one block replacement job.
    OriginHeader:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: Must exactly equal the configured HTTPS pilot origin; missing is rejected.
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
      description: Current session-bound CSRF secret returned by GET /api/session.
  headers:
    SessionCookie:
      description: '__Host-hramatka_session=<opaque>; Path=/; Max-Age=604800; HttpOnly; Secure; SameSite=Lax (no Domain attribute)'
      schema:
        type: string
    ClearedSessionCookie:
      description: '__Host-hramatka_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax (no Domain attribute)'
      schema:
        type: string
    NoStore:
      description: Sensitive session responses are never cached.
      schema:
        type: string
        const: no-store
  requestBodies:
    RevisionMutation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionMutation'
    BlockMoveMutation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BlockMoveMutation'
    ActivityReplacementMutation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivityReplacementMutation'
    ActivityRegenerationCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivityRegenerationCreate'
    RestoreRejectedMutation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestoreRejectedMutation'
    ActivityFeedbackMutation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivityFeedbackMutation'
  schemas:
    PilotActivityType:
      $ref: ../contracts/pilot_activity_types.schema.json#/$defs/pilotActivityType
    InviteRedeemRequest:
      type: object
      additionalProperties: false
      required: [token, nonce]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
          description: Base64url without padding, decoded length exactly 32 bytes.
        nonce:
          type: string
          pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
          description: Tab-local sessionStorage retry proof; only a domain-separated digest is persisted.
    Teacher:
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 100
    TeacherPreferences:
      type: object
      additionalProperties: false
      required: [default_duration]
      properties:
        default_duration:
          type: integer
          const: 45
          description: The sole qualified default for a newly generated lesson.
    Session:
      type: object
      additionalProperties: false
      required: [teacher, expires_at, csrf_token, google_linked]
      properties:
        teacher:
          $ref: '#/components/schemas/Teacher'
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
          description: Keep in memory only; never put in a URL or persistent browser storage.
        google_linked:
          type: boolean
          description: True only when this teacher has an active durable Google subject link; controls whether the setup CTA is shown.
        local_auth_disabled:
          type: boolean
          description: Present and true only for the explicitly enabled loopback local launcher; the UI must show its persistent local-auth warning.
    AnchorInput:
      type: object
      additionalProperties: false
      required: [text, source]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 100000
          description: 1–100000 Unicode code points after JSON decoding; whitespace-only is invalid.
        source:
          type: string
          enum: [teacher-paste]
    LessonCreateRequest:
      type: object
      additionalProperties: false
      required: [id, anchor, level, duration]
      properties:
        id:
          type: string
          format: uuid
        anchor:
          $ref: '#/components/schemas/AnchorInput'
        level:
          type: string
          const: B1
        duration:
          type: integer
          const: 45
          description: New generation is qualified only for 45 minutes.
        methodology:
          type: string
          const: ttt
          default: ttt
          description: Pilot methodology; the only accepted value is `ttt`.
        focus:
          type: [string, 'null']
          maxLength: 500
          default: null
        grammar_focus:
          type: [string, 'null']
          maxLength: 120
          description: Optional trimmed one-line teacher-stated grammar focus.
        logical_model_id:
          type: [string, 'null']
          pattern: '^[a-z0-9]+(?:[.-][a-z0-9]+)*$'
          maxLength: 64
          description: |
            Teacher-visible logical choice. Null/absent is accepted only for
            pre-selector compatibility and fails closed on the production baker.
    QualifiedModelChoice:
      type: object
      additionalProperties: false
      required: [id, label, description]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9]+(?:[.-][a-z0-9]+)*$'
        label:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
    QualifiedModelList:
      type: object
      additionalProperties: false
      required: [registry_version, models, unavailable_message, unavailable_code]
      properties:
        registry_version:
          type: string
          const: QualifiedLogicalModels.v1
        models:
          type: array
          items:
            $ref: '#/components/schemas/QualifiedModelChoice'
        unavailable_message:
          type: [string, 'null']
        unavailable_code:
          type: [string, 'null']
          enum: [no_qualified_model, generation_disabled, null]
          description: Safe state for an empty choice set; null when a model is available.
    LessonCreateAccepted:
      type: object
      additionalProperties: false
      required: [id, status, revision, reused]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/LessonState'
        revision:
          type: integer
          minimum: 1
        reused:
          type: boolean
          description: True only when the UUID was already bound to the identical request.
    LessonState:
      type: string
      enum: [draft, baking, ready, failed, cancelled]
    LessonStep:
      type: string
      enum: [текст отримано, завдання складено, перевірка, готово]
    FailureCode:
      type: [string, 'null']
      enum:
        - null
        - bake_timeout
        - worker_restarted
        - provider_unavailable
        - engine_unavailable
        - insufficient_anchor_capacity
        - lesson_floor_unmet
        - lesson_schema_invalid
        - unknown_safe_failure
        - generation_failed
        - no_eligible_activities
        - cancelled
    LessonStatus:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - step
        - revision
        - attempt
        - attempt_history
        - failure_code
        - failure_message
        - created_at
        - updated_at
        - started_at
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/LessonState'
        step:
          $ref: '#/components/schemas/LessonStep'
        revision:
          type: integer
          minimum: 1
        attempt:
          type: integer
          minimum: 1
        attempt_history:
          type: array
          description: Completed attempts in attempt order, including the current attempt once it is terminal.
          items:
            type: object
            additionalProperties: false
            required: [attempt, status, failure_code, started_at, completed_at, retry_requested_revision]
            properties:
              attempt: {type: integer, minimum: 1}
              status: {type: string, enum: [ready, failed, cancelled]}
              failure_code:
                $ref: '#/components/schemas/FailureCode'
              started_at: {type: [string, 'null'], format: date-time}
              completed_at: {type: string, format: date-time}
              retry_requested_revision: {type: [integer, 'null'], minimum: 1}
        failure_code:
          $ref: '#/components/schemas/FailureCode'
        failure_message:
          type: [string, 'null']
          description: Sanitized teacher-facing text; never a traceback or provider response.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
          description: Start time of the current bake attempt; null before it is claimed.
        progress:
          $ref: '#/components/schemas/TeacherSafeProgress'
    TeacherSafeProgress:
      type: object
      additionalProperties: false
      required:
        - phase
        - phases_total
        - step
        - calls_done
        - calls_planned
        - updated_at
      description: >
        Optional bounded bake snapshot for the teacher UI. It deliberately
        excludes provider routing, watchdogs, failure diagnostics, and other
        durable operator telemetry.
      properties:
        phase:
          type: integer
          minimum: 1
        phases_total:
          type: integer
          minimum: 1
        step:
          type: [string, 'null']
          enum: [generation, gates, assembly, null]
        calls_done:
          type: [integer, 'null']
          minimum: 0
        calls_planned:
          type: [integer, 'null']
          minimum: 0
        updated_at:
          type: string
          format: date-time
    LessonCatalogItem:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - status
        - duration
        - focus
        - methodology
        - grammar_focus
        - anchor_snippet
        - level
        - revision
        - accepted
        - accepted_at
        - accepted_revision
        - failure_code
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, 'null']
          maxLength: 52
          description: Null until a validated lesson is materialized.
        status:
          $ref: '#/components/schemas/LessonState'
        duration:
          type: integer
          enum: [45, 60, 90]
          description: Stored legacy lessons can report 60 or 90; new lessons are 45 only.
        methodology:
          type: string
          const: ttt
        grammar_focus:
          type: [string, 'null']
          maxLength: 120
        anchor_snippet:
          type: string
          maxLength: 140
          description: Short owner-only preview, never the full anchor text.
        level:
          type: string
          const: B1
        focus:
          type: [string, 'null']
        revision:
          type: integer
          minimum: 1
        accepted:
          type: boolean
        accepted_at:
          type: [string, 'null']
          format: date-time
        accepted_revision:
          type: [integer, 'null']
          minimum: 1
        failure_code:
          $ref: '#/components/schemas/FailureCode'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LessonCatalog:
      type: object
      additionalProperties: false
      required: [lessons]
      properties:
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonCatalogItem'
    ActivityDocument:
      allOf:
        - $ref: ../vendor/lu.activity.v1@1.0.0-ffd54054/lu.activity.v1.schema.json
        - type: object
          properties:
            type:
              $ref: '#/components/schemas/PilotActivityType'
    LessonAnchor:
      type: object
      additionalProperties: false
      required: [text, source, chars]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 100000
        source:
          type: string
          enum: [teacher-paste, teacher-url]
        source_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Present only on a legacy stored URL-derived lesson. New lessons accept pasted text only.
        chars:
          type: integer
          minimum: 1
          maximum: 100000
    BlockProvenance:
      type: object
      additionalProperties: false
      required: [source, generator, gates, external_options]
      properties:
        source:
          type: string
          enum: [anchor, generated, teacher]
        generator:
          type: string
          minLength: 1
        gates:
          type: array
          items:
            type: string
            minLength: 1
        external_options:
          type: boolean
    LessonBlock:
      type: object
      additionalProperties: false
      required:
        - id
        - phase
        - type
        - mode
        - activity
        - answer_key
        - mark
        - note
        - edited
        - provenance
        - quality
        - flag_reason_uk
        - flagged_content_hash
        - engine_reason_class
      properties:
        id:
          type: string
          minLength: 1
        phase:
          type: integer
          enum: [1, 2, 3]
        type:
          $ref: '#/components/schemas/PilotActivityType'
        mode:
          type: string
          enum: [усно, письмово, вдома]
        activity:
          $ref: '#/components/schemas/ActivityDocument'
        answer_key:
          type: [string, object, array, 'null']
        mark:
          type: string
          enum: [ok, warn]
        note:
          type: [string, 'null']
        edited:
          type: boolean
        provenance:
          $ref: '#/components/schemas/BlockProvenance'
        quality:
          type: string
          enum: [engine_ok, engine_flagged]
          description: |
            The engine's honest verdict on this block (#402). `engine_flagged`
            content shipped in place after failing gates or exhausting repair;
            it never counts as a ready unit and never reaches the student view.
        flag_reason_uk:
          type: [string, 'null']
          minLength: 1
          description: Teacher-readable Ukrainian flag reason; non-null iff flagged.
        flagged_content_hash:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: |
            sha256 of the canonical flagged activity envelope, frozen at flag
            time; the feedback endpoint's staleness gate. Non-null iff flagged.
        engine_reason_class:
          type: [string, 'null']
          minLength: 1
          description: |
            Raw engine cause class for analytics; teacher-hidden by design.
            Non-null iff flagged.
      description: |
        `type` MUST equal `activity.type`. If `provenance.external_options` is
        true, `mark` MUST be `warn`. Auto-checkable types MUST carry an answer key.
        `flag_reason_uk`, `flagged_content_hash`, and `engine_reason_class` are
        non-null exactly when `quality` is `engine_flagged`.
    RejectedDraft:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, activity, reason]
          properties:
            type:
              type: string
              const: error-correction
            activity:
              $ref: '#/components/schemas/ActivityDocument'
            reason:
              type: string
              minLength: 1
            answer_key:
              $ref: '#/components/schemas/RejectedDraftAnswerKey'
        - type: object
          additionalProperties: false
          required: [type, activity, reason]
          properties:
            type:
              type: string
              enum:
                - true-false
                - cloze
                - match-up
                - text-questions
                - quiz
                - mark-the-words
                - fill-in
                - short-writing
            activity:
              $ref: '#/components/schemas/ActivityDocument'
            reason:
              type: string
              minLength: 1
        - type: object
          additionalProperties: false
          required: [type, activity, reason]
          properties:
            type:
              type: string
              const: flagged-notice
            activity:
              type: 'null'
            reason:
              type: string
              minLength: 1
      description: |
        `type` MUST equal `activity.type`. Only error-correction drafts may
        carry the optional outer answer key; the inner activity remains a pure
        `lu.activity.v1` document. The `flagged-notice` shape (#402) is a
        contentless engine notice: no shape-valid attempt ever existed for the
        slot, so `activity` is exactly null, the reason is teacher-readable
        Ukrainian, and it cannot be restored as an activity.
    RejectedDraftAnswerKey:
      type: object
      additionalProperties: false
      required: [items, corrections]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        corrections:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [sentence, error, correction]
            properties:
              sentence:
                type: string
                minLength: 1
                pattern: '\S'
              error:
                type: string
                minLength: 1
                pattern: '\S'
              correction:
                type: string
                minLength: 1
                pattern: '\S'
    LessonDocument:
      type: object
      additionalProperties: false
      required:
        - schema
        - id
        - title
        - level
        - method
        - focus
        - anchor
        - duration
        - version
        - status
        - last_error
        - accepted
        - blocks
        - rejected
        - created_at
        - updated_at
      properties:
        schema:
          type: string
          const: lu.lesson.v1
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 52
        level:
          type: string
          const: B1
        method:
          type: string
          const: ttt
        focus:
          type: [string, 'null']
        focus_status:
          $ref: '#/components/schemas/FocusStatus'
        anchor:
          $ref: '#/components/schemas/LessonAnchor'
        duration:
          type: integer
          enum: [45, 60, 90]
          description: Stored legacy lessons can report 60 or 90; new lessons are 45 only.
        version:
          type: integer
          const: 1
        status:
          $ref: '#/components/schemas/LessonState'
        last_error:
          type: [string, 'null']
          description: Sanitized only; failed status requires a non-empty value.
        accepted:
          type: boolean
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/LessonBlock'
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/RejectedDraft'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: |
        Pilot-constrained `lu.lesson.v1`. It matches the verbatim public schema
        pinned at `hramatka/vendor/lu.lesson.v1@1.2.0-ffed19d/`, narrows the
        anchor to teacher-paste, and narrows blocks to PILOT_ACTIVITY_TYPES.
    FocusStatus:
      type: object
      additionalProperties: false
      required:
        - requested
        - supported
        - notice_uk
      properties:
        requested:
          type: string
          minLength: 1
          maxLength: 500
          description: The teacher's requested focus, normalized (trimmed).
        supported:
          type: boolean
          description: Whether the anchor text verifiably backs the requested focus.
        notice_uk:
          type: [string, 'null']
          minLength: 1
          description: |
            Engine-authored, learner-facing Ukrainian explaining why the anchor
            cannot support the focus. Non-null exactly when `supported` is false,
            and null exactly when it is true. Rendered verbatim, never translated.
      description: |
        The honest outcome of the teacher's requested focus for this bake
        (`lu.lesson.v1` >= 1.1.0). Absent from the document — never an explicit
        null — when no focus was requested, or when the bake did not judge the
        focus at all and so must not imply that it did.

        When `supported` is false the caveat is not informational: accepting the
        lesson requires acknowledging the reserved `focus-status` id first (see
        `acknowledgeWarningBlock`). Warn never auto-accepts.
    LessonResource:
      type: object
      additionalProperties: false
      required:
        - lesson_id
        - revision
        - accepted_at
        - accepted_revision
        - warning_acknowledgements
        - activity_feedback
        - activity_regenerations
        - logical_model_id
        - methodology
        - grammar_focus
        - lesson
      properties:
        lesson_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        accepted_at:
          type: [string, 'null']
          format: date-time
        accepted_revision:
          type: [integer, 'null']
          minimum: 1
        warning_acknowledgements:
          type: array
          uniqueItems: true
          items:
            type: string
        activity_feedback:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [verdict, comment, updated_at]
            properties:
              verdict:
                type: string
                enum: [good, bad]
              comment:
                type: [string, 'null']
              updated_at:
                type: string
                format: date-time
          description: |
            Applicable-only teacher verdicts keyed by flagged block id (#402):
            a row is present only while its flag-time content hash still
            matches the live block, so it is always the teacher's judgment of
            what is currently on screen.
        activity_regenerations:
          type: array
          items:
            $ref: '#/components/schemas/ActivityRegeneration'
          description: Newest-first owner-scoped replacement history; block snapshots are omitted.
        logical_model_id:
          type: [string, 'null']
          description: Null only for a durable lesson created before model selection.
        methodology:
          type: string
          const: ttt
        grammar_focus:
          type: [string, 'null']
          maxLength: 120
          description: Normalized teacher-stated grammar focus for this bake.
        lesson:
          $ref: '#/components/schemas/LessonDocument'
    RevisionMutation:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 1
          description: Revision last read by this browser; stale values return 409.
    BlockMoveMutation:
      type: object
      additionalProperties: false
      required: [expected_revision, direction]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        direction:
          type: string
          enum: [up, down]
    ActivityReplacementMutation:
      type: object
      additionalProperties: false
      required: [expected_revision, activity]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        activity:
          $ref: '#/components/schemas/ActivityDocument'
    ActivityRegenerationCreate:
      type: object
      additionalProperties: false
      required: [id, expected_revision]
      properties:
        id:
          type: string
          format: uuid
        expected_revision:
          type: integer
          minimum: 1
        feedback:
          type: [string, 'null']
          maxLength: 1000
          description: Optional trimmed teacher guidance, treated as untrusted model input.
    ActivityRegeneration:
      type: object
      additionalProperties: false
      required:
        - id
        - lesson_id
        - block_id
        - base_revision
        - status
        - attempt
        - failure_code
        - failure_message
        - prompt_version
        - prompt_sha256
        - old_block_hash
        - new_block_hash
        - applied_revision
        - created_at
        - updated_at
        - started_at
        - completed_at
      properties:
        id: {type: string, format: uuid}
        lesson_id: {type: string, format: uuid}
        block_id: {type: string, minLength: 1, maxLength: 128}
        base_revision: {type: integer, minimum: 1}
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        attempt: {type: integer, minimum: 1}
        failure_code:
          type: [string, 'null']
          enum:
            - null
            - provider_unavailable
            - generation_failed
            - engine_unavailable
            - revision_conflict
            - block_changed
            - worker_restarted
        failure_message: {type: [string, 'null']}
        prompt_version: {type: string, minLength: 1}
        prompt_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        old_block_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        new_block_hash: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
        applied_revision: {type: [integer, 'null'], minimum: 2}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        reused:
          type: boolean
          description: Present on create only; true for an identical idempotent retry.
    RestoreRejectedMutation:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        phase:
          type: integer
          enum: [1, 2, 3]
    ActivityFeedbackMutation:
      type: object
      additionalProperties: false
      required: [verdict]
      properties:
        verdict:
          type: string
          enum: [good, bad]
          description: «вправа добра» / «вправа погана»
        comment:
          type: [string, 'null']
          maxLength: 2000
          default: 2
          description: Phase to receive the restored warning; defaults to phase 2.
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean
        lesson_id:
          type: string
          format: uuid
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ready
  responses:
    Unauthenticated:
      description: Missing, unknown, expired, or revoked session (indistinguishable)
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: session_required
            message: A valid teacher session is required.
            retryable: false
    CsrfRejected:
      description: Missing/mismatched Origin or missing/invalid session-bound CSRF token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: csrf_rejected
            message: This request did not pass same-origin validation.
            retryable: false
    InviteUnavailable:
      description: Invite is unknown, already used, expired, or revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invite_unavailable
            message: This invite is no longer available.
            retryable: false
    InvalidInput:
      description: Invalid JSON/shape/path value, whitespace-only paste, or paste over 100000 code points
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_input
            message: The request is invalid.
            retryable: false
    PersistenceUnavailable:
      description: SQLite read/transaction/commit failure; no success is reported before commit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: persistence_unavailable
            message: The service could not persist this request. Try again.
            retryable: true
    NotReady:
      description: Readiness dependency failed without exposing internal paths/configuration
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: service_not_ready
            message: The service is not ready.
            retryable: true
    IdempotencyConflict:
      description: The UUID is already bound to a different canonical request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: idempotency_conflict
            message: This lesson ID is already bound to different inputs.
            retryable: false
            lesson_id: 66f0640d-531d-4fca-a0a8-f634b57f16af
    CreateLessonConflict:
      description: |
        Either the UUID is already bound to different canonical inputs
        (`idempotency_conflict`) or the requested logical model is not both
        currently qualified and configured (`model_unavailable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            idempotencyConflict:
              value:
                code: idempotency_conflict
                message: This lesson ID is already bound to different inputs.
                retryable: false
                lesson_id: 66f0640d-531d-4fca-a0a8-f634b57f16af
            modelUnavailable:
              value:
                code: model_unavailable
                message: The selected model is not currently available.
                retryable: false
    ModelUnavailable:
      description: The stored logical model is absent, retired, stale, or not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: model_unavailable
            message: The lesson model is no longer available. Create a new lesson.
            retryable: false
    LessonNotFound:
      description: Lesson does not exist or belongs to another teacher (indistinguishable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: lesson_not_found
            message: Lesson not found.
            retryable: false
    WarningBlockNotFound:
      description: |
        An absent/other-owner lesson returns `lesson_not_found`; a present ready
        lesson whose block is absent or is not a visible needs-review block
        (`mark` is `warn` or `provenance.external_options` is true) returns
        `warning_block_not_found`. A present non-ready lesson returns 409
        `lesson_state_conflict` instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            lesson_absent:
              value:
                code: lesson_not_found
                message: Lesson not found.
                retryable: false
            block_absent:
              value:
                code: warning_block_not_found
                message: Warning block not found.
                retryable: false
    LessonBlockNotFound:
      description: |
        An absent/other-owner lesson returns `lesson_not_found`; a present ready
        lesson whose block is absent returns `lesson_block_not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            lesson_absent:
              value:
                code: lesson_not_found
                message: Lesson not found.
                retryable: false
            block_absent:
              value:
                code: lesson_block_not_found
                message: Lesson block not found.
                retryable: false
    RejectedEntryNotFound:
      description: |
        An absent/other-owner lesson returns `lesson_not_found`; a present ready
        lesson whose rejected-tray index is absent returns
        `rejected_entry_not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            lesson_absent:
              value:
                code: lesson_not_found
                message: Lesson not found.
                retryable: false
            rejected_absent:
              value:
                code: rejected_entry_not_found
                message: Rejected entry not found.
                retryable: false
    LessonNotReady:
      description: Aggregate has not materialized a validated ready lesson
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: lesson_not_ready
            message: The lesson is not ready.
            retryable: false
    MutationConflict:
      description: Stale expected_revision or invalid current aggregate state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            stale_revision:
              value:
                code: revision_conflict
                message: The lesson changed; reload it before trying again.
                retryable: false
                lesson_id: 66f0640d-531d-4fca-a0a8-f634b57f16af
            invalid_state:
              value:
                code: lesson_state_conflict
                message: The lesson is not in a state that allows this change.
                retryable: false
                lesson_id: 66f0640d-531d-4fca-a0a8-f634b57f16af
    RegenerationNotFound:
      description: |
        The lesson does not exist or belongs to another teacher
        (`lesson_not_found`), or the owner-scoped replacement attempt does not
        exist for this lesson (`regeneration_not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            lessonAbsent:
              value:
                code: lesson_not_found
                message: Lesson not found.
                retryable: false
            regenerationAbsent:
              value:
                code: regeneration_not_found
                message: Activity regeneration not found.
                retryable: false
    CreateRegenerationConflict:
      description: |
        A stale revision (`revision_conflict`), invalid lesson or block state
        (`regeneration_state_conflict`), another queued/running replacement
        (`regeneration_in_progress`), a reused UUID with different canonical
        inputs (`idempotency_conflict`), or an unavailable stored model
        (`model_unavailable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            activeReplacement:
              value:
                code: regeneration_in_progress
                message: Another activity regeneration is already in progress.
                retryable: false
            invalidState:
              value:
                code: regeneration_state_conflict
                message: The lesson or block state does not allow regeneration.
                retryable: false
            idempotencyConflict:
              value:
                code: idempotency_conflict
                message: This identifier is already bound to another regeneration.
                retryable: false
    RetryRegenerationConflict:
      description: |
        A stale revision (`revision_conflict`), an attempt not in a retryable
        state (`regeneration_state_conflict`), another queued/running
        replacement (`regeneration_in_progress`), or an unavailable stored
        model (`model_unavailable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            activeReplacement:
              value:
                code: regeneration_in_progress
                message: Another activity regeneration is already in progress.
                retryable: false
            invalidState:
              value:
                code: regeneration_state_conflict
                message: This regeneration attempt cannot be retried.
                retryable: false
    AcceptanceConflict:
      description: Stale expected_revision, non-ready state, or unresolved visible warnings
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            warnings:
              value:
                code: warning_acknowledgements_required
                message: Acknowledge every visible warning before accepting this lesson.
                retryable: false
                lesson_id: 66f0640d-531d-4fca-a0a8-f634b57f16af
            stale_revision:
              value:
                code: revision_conflict
                message: The lesson changed; reload it before trying again.
                retryable: false
                lesson_id: 66f0640d-531d-4fca-a0a8-f634b57f16af
            invalid_state:
              value:
                code: lesson_state_conflict
                message: The lesson is not in a state that allows acceptance.
                retryable: false
                lesson_id: 66f0640d-531d-4fca-a0a8-f634b57f16af
